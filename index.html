<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض المخطوطات العربية المفرغة</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: #151c2c;
            --accent-gold: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a3447;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 30px 15px;
            direction: rtl;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* شبكة عرض المخطوطات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
            box-shadow: 0 12px 35px var(--accent-glow);
        }

        .preview-area {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background-color: #0b0f19;
            padding: 15px;
            /* خلفية الشفافية */
            background-image: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%);
            background-size: 16px 16px;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 8px rgba(255, 255, 255, 0.2));
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .ms-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent-gold), #b89228);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-download:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>مكتبة المخطوطات العربية الفاخرة</h1>
        <p>مخطوطات أصيلة جاهزة للتحميل بدقة PNG شفافة للاستخدام في التصاميم</p>
    </div>

    <!-- شبكة المخطوطات الجاهزة -->
    <div class="grid-container" id="manuscriptsGrid">
        <!-- يتم إدراج البطاقات تلقائياً بواسطة JavaScript -->
    </div>

    <script>
        // قائمة المخطوطات الشفافة والمفرغة جاهزة للتنزيل
        const manuscripts = [
            {
                title: "مخطوطة بسم الله الرحمن الرحيم",
                image: "https://upload.wikimedia.org/wikipedia/commons/2/27/Basmala_calligraphy.svg"
            },
            {
                title: "مخطوطة الحمد لله رب العالمين",
                image: "https://upload.wikimedia.org/wikipedia/commons/2/2b/Al-Hamdulillah_Calligraphy.svg"
            },
            {
                title: "مخطوطة محمد رسول الله",
                image: "https://upload.wikimedia.org/wikipedia/commons/1/18/Muhammad_calligraphy.svg"
            },
            {
                title: "مخطوطة لفظ الجلالة (الله)",
                image: "https://upload.wikimedia.org/wikipedia/commons/f/f2/Allah_vector.svg"
            },
            {
                title: "مخطوطة صلى الله عليه وسلم",
                image: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Peace_be_upon_him_vector.svg"
            },
            {
                title: "مخطوطة ما شاء الله",
                image: "https://upload.wikimedia.org/wikipedia/commons/e/e6/MashaAllah_calligraphy.svg"
            }
        ];

        const container = document.getElementById('manuscriptsGrid');

        // بناء البطاقات
        manuscripts.forEach(ms => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="preview-area">
                    <img src="${ms.image}" alt="${ms.title}">
                </div>
                <div class="card-footer">
                    <span class="ms-title">${ms.title}</span>
                    <a href="${ms.image}" download="${ms.title}.svg" target="_blank" class="btn-download">تحميل المخطوطة</a>
                </div>
            `;
            
            container.appendChild(card);
        });
    </script>
</body>
</html>
